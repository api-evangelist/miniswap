name: Miniswap
description: Miniswap is a Y Combinator (Fall 2025) startup building an online marketplace
  for complex hobbies, starting with tabletop gaming miniatures such as Warhammer. The
  platform maintains a catalog of more than 20,000 unique miniatures with detailed product
  information, and lets sellers photograph an item and have Miniswap automatically generate
  an accurate, detailed listing. It targets the roughly $20 billion tabletop games industry
  and was founded by Zak Singh and Will Hanna, who met at Cambridge. Miniswap is a
  consumer-facing web marketplace at miniswap.gg; as of this enrichment pass it publishes
  no public developer API, SDKs, documentation portal, or discovery artifacts.
